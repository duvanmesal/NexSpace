name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore NexSpace.sln -p:Platform=x64

      - name: Build
        run: dotnet build NexSpace.sln --configuration Release --no-restore -p:Platform=x64

      - name: Test
        run: dotnet test NexSpace.sln --configuration Release --no-build -p:Platform=x64 --logger "trx;LogFileName=test-results.trx"
