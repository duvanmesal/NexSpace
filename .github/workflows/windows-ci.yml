name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore NexSpace.sln -p:Platform=x64

      - name: Build
        run: dotnet build NexSpace.sln --configuration ${{ matrix.configuration }} --no-restore -p:Platform=x64

      - name: Test
        shell: pwsh
        run: |
          dotnet test tests/NexSpace.UnitTests/NexSpace.UnitTests.csproj --configuration ${{ matrix.configuration }} --no-build --logger trx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/NexSpace.IntegrationTests/NexSpace.IntegrationTests.csproj --configuration ${{ matrix.configuration }} --no-build --logger trx

      - name: Validate unpackaged publication
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          dotnet publish src/NexSpace.UI/NexSpace.UI.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:WindowsPackageType=None -p:EnableMsixTooling=false -p:WindowsAppSDKSelfContained=true -o artifacts/unpackaged
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($required in @('NexSpace.UI.exe','resources.pri','MainWindow.xbf','MainPage.xbf','ContainerWindow.xbf','Resources/NexGlass.xbf','Controls/ReferenceTile.xbf')) {
            if (!(Test-Path (Join-Path artifacts/unpackaged $required))) { throw "Missing published resource: $required" }
          }
